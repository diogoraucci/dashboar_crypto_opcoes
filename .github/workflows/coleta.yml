name: Coleta de dados (Binance + Deribit)

on:
  schedule:
    # A cada 15 minutos, mas deslocado 7min dos horários "redondos"
    # (:00/:15/:30/:45), que são os picos de carga documentados pelo GitHub
    # onde execuções agendadas são mais atrasadas/descartadas. Cron do GitHub
    # Actions é sempre em UTC.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}   # permite rodar manualmente pelo botão "Run workflow" na aba Actions

permissions:
  contents: write   # necessário pra o job poder commitar/dar push em data/

concurrency:
  group: coleta-dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements-coleta.txt

      - name: Rodar coleta (Binance + Deribit -> data/)
        run: python coletar_dados.py

      - name: Publicar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data/ é sobrescrito por inteiro a cada coleta (não é um diff
          # incremental) — então "última coleta vence" é sempre a estratégia
          # certa, e não faz sentido tentar reconciliar histórico com rebase
          # (isso só geraria conflito). Em vez disso: busca o que há de mais
          # recente no remoto, avança o ponteiro do branch local pra lá
          # (--soft não mexe na working tree, então os arquivos que acabaram
          # de ser gerados em data/ continuam intactos no disco) e comita
          # nosso resultado por cima disso.
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --soft "origin/${GITHUB_REF_NAME}"
          git add data/
          git diff --cached --quiet || git commit -m "chore: atualizar dados de mercado [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
